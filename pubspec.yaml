name: run_pure
description: "Solrun - 纯本地、零广告跑步记录 App"
publish_to: 'none'
version: 1.0.5+5

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # 状态管理
  flutter_riverpod: ^2.6.1

  # 路由
  go_router: ^14.8.1

  # GPS 定位
  geolocator: ^13.0.2
  flutter_foreground_task: ^8.12.0

  # 地图
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # 本地数据库
  drift: ^2.23.1
  sqlite3_flutter_libs: ^0.5.28

  # 图表
  fl_chart: ^0.70.2

  # 语音播报
  flutter_tts: ^4.2.0

  # 本地偏好设置
  shared_preferences: ^2.3.5

  # 图片选择（头像）
  image_picker: ^1.1.2

  # GPX 导入解析
  xml: ^6.5.0

  # 文件选择（GPX 导入）
  file_picker: ^8.1.7

  # 屏幕常亮
  wakelock_plus: ^1.2.10

  # 路径获取
  path_provider: ^2.1.5
  path: ^1.9.1

  # 分享
  share_plus: ^10.1.4

  # 权限管理
  permission_handler: ^11.3.1

  # AI 功能
  flutter_secure_storage: ^9.2.4
  uuid: ^4.5.1

  # 外部链接（更新下载）
  url_launcher: ^6.3.1
  package_info_plus: ^8.3.0

  # 图标
  cupertino_icons: ^1.0.8
  characters: ^1.4.1
  archive: ^4.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # drift 代码生成
  drift_dev: ^2.23.1
  build_runner: ^2.4.14
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "logo_icon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "logo_icon.png"
  remove_alpha_ios: true

flutter:
  generate: true
  uses-material-design: true

  fonts:
    - family: BebasNeue
      fonts:
        - asset: assets/fonts/BebasNeue-Regular.ttf
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Variable.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-SemiBold.ttf
          weight: 600
